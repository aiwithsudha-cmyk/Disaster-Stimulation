<style>
  :root{
    --ink:#14171C; --panel:#1E2229; --panel-2:#262B33; --line:#383F49;
    --bone:#EDEAE3; --muted:#9CA6B2; --faint:#5B6470;
    --amber:#C1591F; --amber-soft:#7A4426;
    --teal:#4A8C86; --teal-soft:#2E5652;
    --red:#9C3B3B; --green:#4F8F6B;
    --safe-top: env(safe-area-inset-top,0px); --safe-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  html{scroll-padding-top:var(--safe-top);}
  body{
    background:var(--ink); color:var(--bone);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    padding-top:var(--safe-top); padding-bottom:var(--safe-bottom);
    min-height:100%;
  }
  #root{min-height:100vh; display:flex; flex-direction:column;}
  h1,h2,h3,.display{font-family:'Fraunces', Georgia, serif;}
  .mono{font-family:'IBM Plex Mono', 'Courier New', monospace;}
  button{font-family:inherit; cursor:pointer;}
  .btn{
    background:var(--panel-2); color:var(--bone); border:1px solid var(--line);
    border-radius:6px; padding:14px 20px; font-size:15px; font-weight:500;
    transition:border-color .15s, background .15s; text-align:left;
  }
  .btn:hover{border-color:var(--muted); background:#2E3540;}
  .btn-primary{
    background:var(--amber); border:1px solid var(--amber); color:#fff;
    font-weight:600; text-align:center;
  }
  .btn-primary:hover{background:#D5661F;}
  .eyebrow{
    text-transform:uppercase; letter-spacing:.12em; font-size:11px;
    color:var(--muted); font-weight:500;
  }
  .scrim{
    background:linear-gradient(180deg, rgba(20,23,28,0) 0%, rgba(20,23,28,.75) 60%, rgba(20,23,28,.95) 100%);
  }
  .container{max-width:640px; margin:0 auto; width:100%; padding:0 20px;}
  .statbar-track{height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; flex:1;}
  .statbar-fill{height:100%; border-radius:3px; transition:width .4s ease;}
  .hotbar-slot{
    width:44px; height:44px; border-radius:6px; border:1px solid var(--line);
    background:var(--panel); display:flex; align-items:center; justify-content:center;
    font-size:20px; opacity:.35;
  }
  .hotbar-slot.filled{opacity:1; border-color:var(--teal); background:var(--teal-soft);}
  .media-frame{
    width:100%; aspect-ratio:16/9; border-radius:0; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .timer-track{height:4px; background:var(--panel-2); border-radius:2px; overflow:hidden;}
  .timer-fill{height:100%; background:var(--red); transition:width 1s linear;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
</style>
</head>

const {useState, useEffect, useRef} = React;

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  if(audioCtx.state==='suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function playTone(freq, duration, delay, type){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const start = ctx.currentTime + (delay||0);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.12, start+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, start+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(start); osc.stop(start+duration+0.02);
  }catch(e){}
}
function playClick(){ playTone(520, 0.07, 0, 'sine'); }
function playAlert(){ playTone(340, 0.16, 0, 'square'); playTone(200, 0.22, 0.14, 'square'); }

/* ---------------- HELPERS ---------------- */

function clamp(n){return Math.max(0, Math.min(100, n));}

function outcomeTier(safety, composure){
  if(safety < 20) return {tier:5, label:'Critical Outcome'};
  if(composure < 20 && safety >= 60) return {tier:3, label:'Shaken But Safe'};
  const combined = (safety+composure)/2;
  if(combined >= 85 && safety>=75 && composure>=75) return {tier:1, label:'Exemplary Response'};
  if(combined >= 65 && safety>=50 && composure>=50) return {tier:2, label:'Solid Response'};
  if(combined >= 45) return {tier:3, label:'Shaken But Safe'};
  if(combined >= 25) return {tier:4, label:'Close Call'};
  return {tier:5, label:'Critical Outcome'};
}

function SceneMedia({disasterId, sceneId, media, accent, srcOverride, soundOn}){
  const [failed, setFailed] = useState(false);
  const [muted, setMuted] = useState(!soundOn);
  const videoRef = useRef(null);
  const ext = media==='video' ? 'mp4' : 'jpg';
  const src = srcOverride || `assets/${disasterId}/${sceneId}.${ext}`;

  useEffect(()=>{ setFailed(false); setMuted(!soundOn); }, [sceneId]);

  function toggleSound(){
    setMuted(m=>{
      const next = !m;
      if(videoRef.current){
        videoRef.current.muted = next;
        if(!next){ videoRef.current.play().catch(()=>{}); }
      }
      return next;
    });
  }

  if(failed){
    return (
      <div className="media-frame" style={{background:`linear-gradient(135deg, ${accent}33, #14171C)`}}>
        <div style={{textAlign:'center', opacity:.55}}>
          <div className="mono" style={{fontSize:11, letterSpacing:'.08em'}}>SCENE ART — {media.toUpperCase()}</div>
          <div className="mono" style={{fontSize:11, marginTop:2}}>{sceneId}</div>
          <div className="mono" style={{fontSize:10, marginTop:8, opacity:.6}}>expecting: {src}</div>
        </div>
      </div>
    );
  }
  if(media==='video'){
    return (
      <div className="media-frame" style={{background:'#000'}}>
        <video ref={videoRef} key={src} src={src} autoPlay loop muted={muted} playsInline
          style={{width:'100%', height:'100%', objectFit:'cover'}}
          onError={()=>setFailed(true)} />
        <button onClick={toggleSound} aria-label={muted?'Unmute':'Mute'}
          style={{position:'absolute', bottom:12, right:12, width:36, height:36, borderRadius:18,
            background:'rgba(20,23,28,.7)', border:'1px solid rgba(255,255,255,.25)', color:'#fff',
            fontSize:16, display:'flex', alignItems:'center', justifyContent:'center', padding:0}}>
          {muted ? '🔇' : '🔊'}
        </button>
      </div>
    );
  }
  return (
    <div className="media-frame" style={{background:'#000'}}>
      <img key={src} src={src} alt={sceneId}
        style={{width:'100%', height:'100%', objectFit:'cover'}}
        onError={()=>setFailed(true)} />
    </div>
  );
}

/* ---------------- SCREENS ---------------- */

function iconBtnStyle(){
  return {width:34, height:34, borderRadius:17, background:'var(--panel-2)', border:'1px solid var(--line)',
    color:'var(--bone)', fontSize:15, display:'flex', alignItems:'center', justifyContent:'center', padding:0};
}

function Header({screen, disaster, soundOn, onToggleSound, onExit}){
  if(screen==='landing') return null;
  const showExit = screen!=='hub';
  return (
    <div className="container" style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 20px', borderBottom:'1px solid var(--line)'}}>
      <div className="mono" style={{fontSize:11, letterSpacing:'.08em', color:'var(--muted)'}}>
        DISASTER SIM{disaster ? ` · ${disaster.title.toUpperCase()}` : ''}
      </div>
      <div style={{display:'flex', gap:8}}>
        <button onClick={onToggleSound} style={iconBtnStyle()} aria-label="Toggle sound">{soundOn ? '🔊' : '🔇'}</button>
        {showExit && <button onClick={onExit} style={iconBtnStyle()} aria-label="Exit to menu">✕</button>}
      </div>
    </div>
  );
}

function Landing({onEnter}){
  return (
    <div className="fade-in" style={{flex:1, display:'flex', flexDirection:'column', justifyContent:'flex-end', minHeight:'100vh', position:'relative', backgroundImage:`linear-gradient(160deg, rgba(20,23,28,.25) 0%, rgba(20,23,28,.55) 100%), url(${HERO_IMG})`, backgroundSize:'cover', backgroundPosition:'center'}}>
      <div className="scrim" style={{position:'absolute', inset:0}}></div>
      <div className="container" style={{position:'relative', paddingBottom:60, paddingTop:80}}>
        <div className="eyebrow" style={{marginBottom:14}}>A Decision-Based Survival Simulation</div>
        <h1 className="display" style={{fontSize:44, lineHeight:1.05, margin:'0 0 16px', fontWeight:600}}>Disaster<br/>Simulation</h1>
        <p style={{color:'var(--muted)', fontSize:15, lineHeight:1.6, maxWidth:440, margin:'0 0 32px'}}>
          Every second counts. Every choice matters. Step into the moment before disaster strikes — and find out what you'd really do.
        </p>
        <button className="btn btn-primary" style={{width:'100%', padding:'16px 20px', fontSize:16}} onClick={onEnter}>Enter</button>
      </div>
    </div>
  );
}

function Hub({onSelect}){
  return (
    <div className="fade-in container" style={{paddingTop:36, paddingBottom:40}}>
      <div className="eyebrow">Mission Select</div>
      <h2 className="display" style={{fontSize:26, margin:'6px 0 26px'}}>Choose a Scenario</h2>
      <div style={{display:'flex', flexDirection:'column', gap:12}}>
        {Object.values(DISASTERS).map(d=>(
          <button key={d.id} className="btn" disabled={d.locked}
            style={{display:'flex', justifyContent:'space-between', alignItems:'center', opacity:d.locked?.5:1, cursor:d.locked?'default':'pointer', borderLeft:`3px solid ${d.accent}`}}
            onClick={()=>!d.locked && onSelect(d.id)}>
            <div>
              <div style={{fontWeight:600, fontSize:15}}>{d.title}</div>
              <div style={{color:'var(--muted)', fontSize:13, marginTop:2}}>{d.tagline}</div>
            </div>
            <div className="mono" style={{fontSize:11, color:'var(--faint)'}}>{d.locked ? (d.note||'Coming Soon') : 'Play →'}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

function Briefing({disaster, onBegin, onBack}){
  const b = disaster.briefing;
  const rows = [['Situation', b.situation],['Objective', b.objective],['Threat Level', b.threat],['Est. Time', b.time]];
  return (
    <div className="fade-in container" style={{paddingTop:36, paddingBottom:40}}>
      <button className="mono" style={{background:'none', border:'none', color:'var(--muted)', fontSize:12, padding:0, marginBottom:20}} onClick={onBack}>← Missions</button>
      <div className="eyebrow" style={{color:disaster.accent}}>Situation Briefing</div>
      <h2 className="display" style={{fontSize:26, margin:'6px 0 22px'}}>{disaster.title}</h2>
      <div style={{border:'1px solid var(--line)', borderRadius:8, overflow:'hidden', marginBottom:28}}>
        {rows.map(([k,v],i)=>(
          <div key={k} style={{display:'flex', padding:'14px 16px', borderTop:i?'1px solid var(--line)':'none', background:'var(--panel)'}}>
            <div className="mono" style={{width:110, color:'var(--muted)', fontSize:11, textTransform:'uppercase', letterSpacing:'.06em'}}>{k}</div>
            <div style={{flex:1, fontSize:14, lineHeight:1.5}}>{v}</div>
          </div>
        ))}
      </div>
      <button className="btn btn-primary" style={{width:'100%', padding:16, fontSize:15}} onClick={onBegin}>Begin Mission</button>
    </div>
  );
}

function Scene({disaster, scene, sceneId, inventory, soundOn, onChoice}){
  const [timeLeft, setTimeLeft] = useState(scene.timer || 0);
  useEffect(()=>{
    if(!scene.timer) return;
    setTimeLeft(scene.timer);
    const iv = setInterval(()=>{
      setTimeLeft(t=>{
        if(t<=1){ clearInterval(iv); onChoice(scene.choices.find(c=>c.id===scene.timeoutChoice) || scene.choices[0]); return 0; }
        return t-1;
      });
    },1000);
    return ()=>clearInterval(iv);
  }, [sceneId]);

  const visibleChoices = scene.choices.filter(c => !c.requiresItem || inventory.includes(c.requiresItem));

  return (
    <div className="fade-in" style={{flex:1, display:'flex', flexDirection:'column'}}>
      <SceneMedia disasterId={disaster.id} sceneId={sceneId} media={scene.media} accent={disaster.accent} srcOverride={scene.src} soundOn={soundOn}/>
      <div className="container" style={{marginTop:14}}>
        <div className="mono" style={{fontSize:11, color:'var(--muted)', letterSpacing:'.05em'}}>{disaster.title.toUpperCase()} — {scene.location}</div>
      </div>
      {scene.timer && (
        <div className="container" style={{marginTop:10}}>
          <div className="timer-track"><div className="timer-fill" style={{width:(timeLeft/scene.timer*100)+'%'}}></div></div>
        </div>
      )}
      <div className="container" style={{marginTop:16, flex:1}}>
        <p style={{fontSize:16, lineHeight:1.6, margin:'0 0 22px'}}>{scene.text}</p>
        {!scene.ending && (
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            {visibleChoices.map((c,i)=>(
              <button key={i} className="btn" onClick={()=>onChoice(c)}>
                {c.requiresItem && <span style={{marginRight:8}}>{ITEMS[c.requiresItem].icon}</span>}
                {c.label}
              </button>
            ))}
          </div>
        )}
        {scene.ending && (
          <button className="btn btn-primary" style={{width:'100%', padding:16}} onClick={()=>onChoice({end:true})}>Continue</button>
        )}
      </div>
    </div>
  );
}

function Outcome({disaster, stats, choiceLog, onDebrief, onRestart, onHub}){
  const {tier, label} = outcomeTier(stats.safety, stats.composure);
  const impact = c => (c.delta.safety||0) + (c.delta.composure||0);
  const strengths = choiceLog.filter(c=>!c.risky).sort((a,b)=>impact(b)-impact(a)).slice(0,3);
  const growth = choiceLog.filter(c=>c.risky).sort((a,b)=>impact(a)-impact(b)).slice(0,5);
  const turningPoint = choiceLog.length ? [...choiceLog].sort((a,b)=>Math.abs(impact(b))-Math.abs(impact(a)))[0] : null;
  const tierColor = tier<=2 ? 'var(--green)' : tier===3 ? 'var(--teal)' : 'var(--red)';
  return (
    <div className="fade-in container" style={{paddingTop:36, paddingBottom:40}}>
      <div className="eyebrow">Mission Result</div>
      <h2 className="display" style={{fontSize:26, margin:'6px 0 6px', color:tierColor}}>{label}</h2>
      <p style={{color:'var(--muted)', fontSize:14, lineHeight:1.6, margin:'0 0 24px'}}>{TIER_COPY[tier]}</p>
      <div style={{display:'flex', flexDirection:'column', gap:14, marginBottom:26}}>
        <StatBar label="SAFETY" value={stats.safety} color="var(--amber)"/>
        <StatBar label="COMPOSURE" value={stats.composure} color="var(--teal)"/>
      </div>
      {turningPoint && (
        <div style={{padding:16, background:'var(--panel)', border:`1px solid ${turningPoint.risky?'var(--red)':'var(--green)'}55`, borderRadius:8, marginBottom:24}}>
          <div className="mono" style={{fontSize:11, color:turningPoint.risky?'var(--red)':'var(--green)', marginBottom:6}}>TURNING POINT</div>
          <div style={{fontSize:14, lineHeight:1.5}}>{turningPoint.label}</div>
        </div>
      )}
      {strengths.length>0 && <>
        <div className="mono" style={{fontSize:11, color:'var(--green)', marginBottom:8}}>STRENGTHS</div>
        <ul style={{margin:'0 0 20px', paddingLeft:18, fontSize:14, lineHeight:1.7}}>
          {strengths.map((c,i)=><li key={i}>{c.label}</li>)}
        </ul>
      </>}
      {growth.length>0 && <>
        <div className="mono" style={{fontSize:11, color:'var(--red)', marginBottom:8}}>GROWTH EDGE</div>
        <ul style={{margin:'0 0 26px', paddingLeft:18, fontSize:14, lineHeight:1.7}}>
          {growth.map((c,i)=><li key={i}>{c.label}</li>)}
        </ul>
      </>}
      <div style={{display:'flex', flexDirection:'column', gap:10}}>
        <button className="btn btn-primary" style={{padding:15}} onClick={onDebrief}>See Reality Check</button>
        <button className="btn" style={{textAlign:'center'}} onClick={onRestart}>Replay Mission</button>
        <button className="btn" style={{textAlign:'center'}} onClick={onHub}>Back to Missions</button>
      </div>
    </div>
  );
}

function Debrief({disaster, choiceLog, onHub, onRestart}){
  const debriefMap = DATASETS[disaster.id].debrief;
  const items = choiceLog.filter(c=>c.key && debriefMap[c.key]);
  return (
    <div className="fade-in container" style={{paddingTop:36, paddingBottom:40}}>
      <div className="eyebrow" style={{color:disaster.accent}}>Reality Check</div>
      <h2 className="display" style={{fontSize:24, margin:'6px 0 20px'}}>What Experts Recommend</h2>
      {items.length===0 && <p style={{color:'var(--muted)', fontSize:14}}>Your choices closely matched official safety guidance throughout — no corrections needed.</p>}
      <div style={{display:'flex', flexDirection:'column', gap:14, marginBottom:28}}>
        {items.map((c,i)=>(
          <div key={i} style={{padding:16, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8}}>
            <div style={{fontWeight:600, fontSize:13, marginBottom:6, color:'var(--red)'}}>{c.label}</div>
            <div style={{fontSize:13.5, lineHeight:1.6, color:'var(--bone)'}}>{debriefMap[c.key]}</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:10}}>
        <button className="btn btn-primary" style={{padding:15}} onClick={onRestart}>Replay Mission</button>
        <button className="btn" style={{textAlign:'center'}} onClick={onHub}>Back to Missions</button>
      </div>
    </div>
  );
}

/* ---------------- APP ---------------- */

function App(){
  const [screen, setScreen] = useState('landing');
  const [disasterId, setDisasterId] = useState(null);
  const [sceneId, setSceneId] = useState(null);
  const [stats, setStats] = useState({safety:100, composure:100});
  const [inventory, setInventory] = useState([]);
  const [choiceLog, setChoiceLog] = useState([]);
  const [soundOn, setSoundOn] = useState(true);

  useEffect(()=>{
    function handleClick(e){
      if(soundOn && e.target.closest && e.target.closest('button')){ playClick(); }
    }
    document.addEventListener('click', handleClick, true);
    return ()=>document.removeEventListener('click', handleClick, true);
  }, [soundOn]);

  const disaster = disasterId ? DISASTERS[disasterId] : null;
  const dataset = disasterId ? DATASETS[disasterId] : null;

  function beginMission(){
    setStats({safety:100, composure:100});
    setInventory([]);
    setChoiceLog([]);
    setSceneId(disaster.startScene);
    setScreen('scene');
  }

  function handleChoice(choice){
    if(choice.end){ setScreen('outcome'); return; }
    if(choice.delta){
      if(choice.delta.safety < 0 && soundOn){ playAlert(); }
      setStats(s=>({safety:clamp(s.safety+choice.delta.safety), composure:clamp(s.composure+choice.delta.composure)}));
    }
    if(choice.grantItem){ setInventory(inv=> inv.includes(choice.grantItem)?inv:[...inv, choice.grantItem]); }
    if(choice.id){
      setChoiceLog(log=>[...log, {label:choice.label, risky:!!choice.risky, key: sceneId+'_'+choice.id, delta: choice.delta || {safety:0,composure:0}}]);
    }
    const nextScene = dataset.scenes[choice.next];
    setSceneId(choice.next);
    if(nextScene && nextScene.ending===undefined){}
  }

  let body;
  if(screen==='landing') body = <Landing onEnter={()=>setScreen('hub')}/>;
  else if(screen==='hub') body = <Hub onSelect={(id)=>{setDisasterId(id); setScreen('briefing');}}/>;
  else if(screen==='briefing') body = <Briefing disaster={disaster} onBack={()=>setScreen('hub')} onBegin={beginMission}/>;
  else if(screen==='scene'){
    const scene = dataset.scenes[sceneId];
    body = (
      <div style={{display:'flex', flexDirection:'column', flex:1}}>
        <div className="container" style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 20px'}}>
          <Hotbar inventory={inventory}/>
          <div style={{display:'flex', gap:16}}>
            <StatBar label="SAFETY" value={stats.safety} color="var(--amber)"/>
            <StatBar label="COMPOSURE" value={stats.composure} color="var(--teal)"/>
          </div>
        </div>
        <Scene disaster={disaster} scene={scene} sceneId={sceneId} inventory={inventory} soundOn={soundOn} onChoice={handleChoice}/>
      </div>
    );
  }
  else if(screen==='outcome') body = <Outcome disaster={disaster} stats={stats} choiceLog={choiceLog} onDebrief={()=>setScreen('debrief')} onRestart={beginMission} onHub={()=>setScreen('hub')}/>;
  else if(screen==='debrief') body = <Debrief disaster={disaster} choiceLog={choiceLog} onRestart={beginMission} onHub={()=>setScreen('hub')}/>;

  function requestExit(){
    if(window.confirm('Exit this mission and return to Mission Select? Your progress will be lost.')){
      setScreen('hub');
    }
  }

  return (
    <div style={{display:'flex', flexDirection:'column', minHeight:'100vh'}}>
      <Header screen={screen} disaster={disaster} soundOn={soundOn} onToggleSound={()=>setSoundOn(s=>!s)} onExit={requestExit}/>
      {body}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
